# ---------------------------- PROJECTS -------------------------------
# title       : project name
# description : one or two lines
# url         : repo or live link
# tags        : list of tech / topics (shown as badges)
# image       : (optional) screenshot/logo -> /img/portfolio/projects/
# featured    : true to highlight & sort first
projects:
  - title: "Visualisation Plugin — CarbonHack 2024"
    description: "Open-source data product (Datamusers team, CarbonHack 2024 by the Green Software Foundation) that analyses carbon emissions and CPU energy consumption of servers and generates reports — usable directly in a CI/CD pipeline."
    url: "https://github.com/ramgsuri/visualization-plugin"
    tags:
      - "Green Software"
      - "Sustainability"
      - "JavaScript"
      - "CarbonHack 2024"
      - "Open Source"
    featured: true

  - title: "Car Booking App"
    description: "Sample microservices-based car booking application."
    url: "https://github.com/ramgsuri/car-booking-app"
    tags:
      - "Java"
      - "Spring Boot"
      - "Microservices"

  - title: "Spark Streaming — Live Tweets"
    description: "Real-time tweet stream processing with Apache Spark."
    url: "https://github.com/ramgsuri/spark_streaming_live_tweets"
    tags:
      - "Spark"
      - "Streaming"
      - "Data Engineering"


